            color: #f8fafc;
            display: flex;
            flex-direction: column;

            font-size: 32px;

            color: #fff;

        }

            height: 24px;

            justify-content: center;
            gap: 25px;
            font-size: 14px;
            color: #64748b;
            margin-top: 20px;
