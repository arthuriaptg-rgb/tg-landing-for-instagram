<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Доступ к материалам</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            max-width: 320px;
            width: 90%;
        }
        h1 {
            font-size: 22px;
            color: #333;
            margin-bottom: 10px;
        }
        p {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            background-color: #2AABEE;
            color: #ffffff;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
            padding: 16px 30px;
            border-radius: 12px;
            width: 100%;
            box-sizing: border-box;
            transition: background 0.3s ease;
        }
        .btn:active {
            background-color: #2298d6;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Ваша связка готова</h1>
        <p>Материалы будут отправлены автоматически в Telegram-бот.</p>
        
        <!-- ВМЕСТО ВАША_ССЫЛКА_НА_БОТА ВСТАВЬ СВОЙ ДИПЛИНК ИЛИ ССЫЛКУ -->
        <a href="ВАША_ССЫЛКА_НА_БОТА" class="btn">Открыть в Telegram</a>
    </div>

</body>
</html>
